<?xml version="1.0" encoding="UTF-8"?>
<!--
  Karanlik tema surumu. .github/workflows/snake.yml tarafindan yeniden uretilir.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 148" width="800" height="148" role="img" aria-label="Katkı grafiği">
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .lbl { font-size: 10.5px; letter-spacing: 2.6px; fill: #9a9a9a; font-weight: 700; }
    .body { font-size: 12px; fill: #E5E5E5; fill-opacity: 0.66; }
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4444"/>
      <stop offset="100%" stop-color="#FF0000"/>
    </linearGradient>
  </defs>

  <rect width="800" height="148" rx="12" fill="#101010" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <rect x="1" y="1" width="798" height="3" rx="1.5" fill="url(#brand)"/>

  <text class="ui lbl" x="24" y="42">KATKI GRAFIĞİ</text>
  <text class="ui" x="24" y="78" font-size="16" font-weight="700" fill="#FFFFFF">Animasyon henüz üretilmedi</text>
  <text class="ui body" x="24" y="102">Actions → Generate snake → Run workflow</text>
  <text class="mono" x="24" y="128" font-size="11" fill="#E5E5E5" fill-opacity="0.35">Platane/snk</text>
</svg>