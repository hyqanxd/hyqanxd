<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bu dosya .github/workflows/metrics.yml tarafindan her gun otomatik yeniden uretilir.
  Ilk calistirmadan once gosterilen yer tutucudur.
  Actions -> Metrics -> Run workflow
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 264" width="480" height="264" role="img" aria-label="GitHub istatistikleri">
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .lbl { font-size: 10.5px; letter-spacing: 2.6px; fill: #9a9a9a; font-weight: 700; }
    .body { font-size: 11.5px; fill: #E5E5E5; fill-opacity: 0.66; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .20; } 50% { opacity: .55; } }
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4444"/>
      <stop offset="100%" stop-color="#FF0000"/>
    </linearGradient>
  </defs>

  <rect width="480" height="264" rx="12" fill="#101010" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <rect x="1" y="1" width="478" height="3" rx="1.5" fill="url(#brand)"/>

  <text class="ui lbl" x="24" y="40">GITHUB İSTATİSTİKLERİ</text>
  <text class="ui" x="24" y="74" font-size="16" font-weight="700" fill="#FFFFFF">Henüz üretilmedi</text>
  <text class="ui body" x="24" y="98">İlk veriyi üretmek için repoyu Actions sekmesinden</text>
  <text class="mono" x="24" y="120" font-size="11.5" fill="#E5E5E5" fill-opacity="0.66">Metrics → Run workflow</text>

  <rect class="pulse" x="24" y="140" width="432" height="2" fill="#FF0000"/>

  <g fill="#161616" stroke="#FFFFFF" stroke-opacity="0.06">
    <rect x="24" y="164" width="208" height="76" rx="10"/>
    <rect x="248" y="164" width="208" height="76" rx="10"/>
  </g>
  <text class="ui" x="24" y="256" font-size="10.5" fill="#E5E5E5" fill-opacity="0.35">lowlighter/metrics · günlük otomatik güncelleme</text>
</svg>