name: Metrics

# GitHub istatistiklerini (assets/metrics.svg) her gün otomatik yeniler.
# lowlighter/metrics, ürettiği SVG'yi bu depoya kendisi commit eder.
#
# Not: Bu profil koyu temalı. metrics varsayılan olarak açık zemin üretir;
#      extras_css içindeki `svg { background-color: ... }` kartı koyulaştırır,
#      böylece kart hem açık hem koyu GitHub temasında okunur.

on:
  schedule:
    - cron: "17 3 * * *" # her gün 03:17 UTC
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # KİŞİSEL ERİŞİM JETONU (CLASSIC PAT) ŞART.
          # Repo kapsamlı GITHUB_TOKEN kullanıcı/aktivite verisini okuyamaz;
          # fine-grained token GraphQL'de desteklenmiyor.
          # Token üretimi ve secret ekleme: KULLANIM.md
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.svg

          # panel içeriği (istatistik özeti + diller + takvim)
          base: header, community, repositories, metadata

          # açıkça istenen eklentiler
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_languages: yes
          plugin_languages_limit: 8

          # kapalı eklentiler — "Unexpected error" satırı üretmemeleri için:
          #   plugin_habits / plugin_activity  -> classic token yetkisiz
          #   plugin_repositories             -> proje adlarını profilde göstermek istemiyoruz
          #   plugin_isocalendar              -> takvim zaten var (tekrar ediyordu)
          #   plugin_lines / plugin_sponsors   -> içerik üretmiyor
          plugin_habits: no
          plugin_activity: no
          plugin_repositories: no
          plugin_isocalendar: no
          plugin_lines: no
          plugin_sponsors: no

          # AniTilky teması: koyu kart zemini + kırmızı başlık ve ikonlar
          extras_css: |
            svg {
              background-color: #0D1117;
            }
            h1, h2, h3 {
              color: #FF0000 !important;
            }
            .field {
              color: #E5E5E5;
            }
            .field svg {
              fill: #FF0000;
            }

          # takvim hücrelerini yeşil ölçek yerine kırmızı ısı skalasına çevirir
          extras_js: |
            for (const [from, to] of [
              ["#ebedf0", "#161b22"],
              ["#9be9a8", "#4a0000"],
              ["#40c463", "#a30000"],
              ["#30a14e", "#d40000"],
              ["#216e39", "#ff0000"],
            ])
              document.querySelectorAll(`svg g [fill="${from}"]`).forEach(node => node.setAttribute("fill", to))