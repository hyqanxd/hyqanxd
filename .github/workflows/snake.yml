name: Generate snake

# Katkı grafiğini (dist/output/*.svg) her gün yeniler.
# NOT: gh-pages'a ayrıca yayınlama yapılmıyor; README görseli depodaki dosyadan
# göreli yol ile okuduğu için (./dist/output/...) ek bir yayın adımı gereksiz.

on:
  schedule:
    - cron: "23 3 * * *" # her gün 03:23 UTC
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "dist/output/**"
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update snake animation"
          file_pattern: "*.svg dist/output"